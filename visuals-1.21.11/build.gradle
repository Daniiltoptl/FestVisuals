
plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/festvisuals.accesswidener")

	runs {
	}

	runs.configureEach {
		vmArgs '--enable-native-access=ALL-UNNAMED',
				'--sun-misc-unsafe-memory-access=allow',
				'-Djoml.nounsafe=true'
	}
}

repositories {
    flatDir { dirs 'libs' }
	mavenCentral()
	maven {
		name = "FirstDark"
		url = uri("https://maven.firstdark.dev/releases")
	}
	maven {
		name = "Jitpack"
		url = uri("https://jitpack.io")
	}
	maven {
		name = "Modrinth"
		url = uri("https://api.modrinth.com/maven")
		content { includeGroup "maven.modrinth" }
	}
}

configurations {
	bundled {
		canBeConsumed = false
		canBeResolved = true
	}
	implementation.extendsFrom bundled
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	compileOnly "org.projectlombok:lombok:${project.lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
	annotationProcessor "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
	annotationProcessor "net.fabricmc:fabric-mixin-compile-extensions:0.6.0"

	bundled "com.github.donyka:discord-rpc:${project.drpc_version}"

	// Performance mods shipped inside our jar (Jar-in-Jar). Fabric Loader keeps a single copy of
	// each mod id and prefers whatever satisfies every dependency, newest first — so when a player
	// already has their own Sodium (or Lithium, ...) in the mods folder, the bundled one simply
	// stands down, and Iris' version constraints on Sodium are still honoured.
	// Licences allow redistribution with the licence kept (each jar carries its own): Sodium
	// (PolyForm Shield), Lithium and ImmediatelyFast (LGPL), FerriteCore and Dynamic FPS (MIT).
	// EntityCulling and MoreCulling are deliberately not bundled: their licences forbid it or
	// would pull the whole mod under the GPL.
	["sodium:${project.sodium_version}",
	 "lithium:${project.lithium_version}",
	 "ferrite-core:${project.ferritecore_version}",
	 "immediatelyfast:${project.immediatelyfast_version}"].each { coordinate ->
		modImplementation "maven.modrinth:${coordinate}"
		include "maven.modrinth:${coordinate}"
		modRuntimeOnly "maven.modrinth:${coordinate}"
	}
	// Dynamic FPS needs its own nested "battery" library, which dev runs do not unpack: it is
	// shipped inside the jar only and skipped when running from the IDE.
	include "maven.modrinth:dynamic-fps:${project.dynamicfps_version}"

	implementation "org.json:json:${project.json_version}"
}

// Client game tests (./gradlew runClientGameTest) live in their own source set and never ship:
// they create a world, set up a scene and take screenshots of the visuals for inspection.

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "festvisuals-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Loom's own Mixin annotation-processor wiring does not kick in with the lazily-registered remap
// plugin here, so hand the processor the named->intermediary mappings and a refmap path ourselves.
// Without the refmap every string-named @Inject target is looked up unmapped at runtime and fails.
tasks.withType(JavaCompile).configureEach { task ->
	task.options.compilerArgumentProviders.add({ ->
		def dir = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${project.minecraft_version}")
		def tiny = fileTree(dir).matching { include "loom.mappings*/mappings.tiny" }.files.find { true }
		if (tiny == null) return []
		[
			"-AinMapFileNamedIntermediary=${tiny}",
			"-AoutMapFileNamedIntermediary=${buildDir}/mixin.out.tiny",
			"-AoutRefMapFile=${task.destinationDirectory.get().asFile}/festvisuals-refmap.json",
			"-AdefaultObfuscationEnv=named:intermediary"
		]
	} as CommandLineArgumentProvider)
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
	it.options.compilerArgs += ["-Xmaxerrs", "5000"]
}

tasks.named('test', Test) {
	failOnNoDiscoveredTests = false
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from {
		configurations.bundled.collect { it.isDirectory() ? it : zipTree(it) }
	}
	duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}



// Not part of `build`: the ProGuard step fails on JDK 25 (no jmods) and its output crashed the
// client, so the default build ships the plain jar. Run `gradlew obfuscateJar` explicitly to try it.







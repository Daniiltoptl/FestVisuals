name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'visuals/**'
      - 'visuals-1.21.11/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

# Two releases running at once both bump the version and push to main; the
# second one loses the race. Let a newer push wait for the current release
# instead of racing it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump version
        id: version
        run: |
          set -euo pipefail
          CURRENT=$(grep '^mod_version=' visuals/gradle.properties | cut -d'=' -f2)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          sed -i "s/^mod_version=.*/mod_version=$NEW_VERSION/" visuals/gradle.properties

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add visuals/gradle.properties
          git commit -m "chore: bump version to ${{ steps.version.outputs.tag }} [skip ci]"

          # GitHub occasionally answers a push with a 500, and main may also have
          # moved if another push landed while this run was building. Rebase and
          # retry rather than losing the whole release to a transient failure.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep $((attempt * 10))
            git pull --rebase origin main
          done
          echo "could not push the version bump after 3 attempts" >&2
          exit 1

      - name: Tag release
        run: |
          set -euo pipefail
          git tag ${{ steps.version.outputs.tag }}

          for attempt in 1 2 3; do
            if git push origin ${{ steps.version.outputs.tag }}; then
              exit 0
            fi
            echo "tag push attempt $attempt failed, retrying"
            sleep $((attempt * 10))
          done
          echo "could not push tag ${{ steps.version.outputs.tag }} after 3 attempts" >&2
          exit 1

      - name: Grant execute permission for gradlew
        run: chmod +x visuals/gradlew

      - name: Build
        working-directory: visuals
        run: ./gradlew build --stacktrace

      - name: Prepare release asset
        id: asset
        run: |
          set -euo pipefail
          JAR=$(find visuals/build/libs -maxdepth 1 -iname "*.jar" ! -iname "*-sources.jar" | head -n1)
          if [ -z "$JAR" ]; then
            echo "Собранный jar не найден в visuals/build/libs" >&2
            exit 1
          fi

          # На сегодня существует только Free-редакция (см. README/CLAUDE.md).
          # Когда появится платная сборка — добавьте здесь второй build-таргет
          # (например через отдельный gradle-профиль) и второй ассет
          # festvisuals-paid.jar.
          cp "$JAR" festvisuals-free.jar
          echo "asset=festvisuals-free.jar" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.asset.outputs.asset }}

      # The launcher installs the mod from the public releases repo (this repo is private, so
      # players' launchers cannot read its releases). One rolling pre-release, tag "mod", always
      # holds the current jar plus mod.json with its version and checksum; being a pre-release it
      # never counts as the "latest" launcher release that the launcher's updater looks at.
      - name: Publish mod for the launcher
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          REPO=Daniiltoptl/FestVisuals-Releases
          SHA1=$(sha1sum festvisuals-free.jar | cut -d' ' -f1)
          SIZE=$(stat -c %s festvisuals-free.jar)
          printf '{"version":"%s","file":"festvisuals-free.jar","sha1":"%s","size":%s}\n' "$VERSION" "$SHA1" "$SIZE" > mod.json
          if ! gh release view mod --repo "$REPO" >/dev/null 2>&1; then
            gh release create mod --repo "$REPO" --prerelease --title "FestVisuals mod" --notes "Текущая сборка мода для лаунчера."
          fi
          # Jar first: whoever reads the new mod.json must find the matching jar already there.
          gh release upload mod festvisuals-free.jar --repo "$REPO" --clobber
          gh release upload mod mod.json --repo "$REPO" --clobber

      # The 1.21.11 port is built from its own project; same version number, "+1.21.11" suffix. Its
      # jar goes to the releases repo as a second rolling release ("mod-1.21.11") for the launcher.
      - name: Build 1.21.11 port
        working-directory: visuals-1.21.11
        run: |
          chmod +x gradlew
          ./gradlew build -x test --stacktrace -Pmod_version=${{ steps.version.outputs.version }}+1.21.11

      - name: Publish 1.21.11 mod for the launcher
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          REPO=Daniiltoptl/FestVisuals-Releases
          JAR=$(find visuals-1.21.11/build/libs -maxdepth 1 -iname "*.jar" ! -iname "*-sources.jar" | head -n1)
          cp "$JAR" festvisuals-1.21.11.jar
          SHA1=$(sha1sum festvisuals-1.21.11.jar | cut -d' ' -f1)
          SIZE=$(stat -c %s festvisuals-1.21.11.jar)
          printf '{"version":"%s","file":"festvisuals-1.21.11.jar","sha1":"%s","size":%s}\n' "$VERSION" "$SHA1" "$SIZE" > mod-1.21.11.json
          if ! gh release view mod-1.21.11 --repo "$REPO" >/dev/null 2>&1; then
            gh release create mod-1.21.11 --repo "$REPO" --prerelease --title "FestVisuals mod 1.21.11" --notes "Текущая сборка мода 1.21.11 для лаунчера."
          fi
          gh release upload mod-1.21.11 festvisuals-1.21.11.jar --repo "$REPO" --clobber
          gh release upload mod-1.21.11 mod-1.21.11.json --repo "$REPO" --clobber

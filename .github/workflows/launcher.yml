name: Launcher

# Builds the Windows launcher and publishes it to the public releases repo, where installed
# launchers find it through electron-updater (latest.yml) and update themselves on start.

on:
  push:
    branches:
      - main
    paths:
      - 'launcher/**'
      - 'jarvis-server/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher
  cancel-in-progress: false

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Install
        run: npm ci

      # Every build gets a higher version than the last, which is what the updater compares:
      # major.minor from package.json, patch from the run number.
      - name: Version
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          npm version "$BASE.${{ github.run_number }}" --no-git-tag-version --allow-same-version
          node -p "'version ' + require('./package.json').version"

      - name: Bundle the current mod
        run: node scripts/bundle-mod.mjs

      - name: Build UI
        run: npm run build

      - name: Build and publish installer
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: npx electron-builder --win --publish always

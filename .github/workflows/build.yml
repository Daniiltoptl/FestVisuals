name: Build

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'visuals/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'visuals/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visuals

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: festvisuals-build-${{ github.sha }}
          path: visuals/build/libs/*.jar
          retention-days: 14

import proguard.gradle.ProGuardTask

buildscript {
	repositories { mavenCentral() }
	dependencies { classpath "com.guardsquare:proguard-gradle:7.10.0" }
}

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/festvisuals.accesswidener")

	runs {
		client2 {
			client()
			name = "Minecraft Client 2"
			runDir = "run2"
			ideConfigGenerated = true
		}
	}

	runs.configureEach {
		vmArgs '--enable-native-access=ALL-UNNAMED',
				'--sun-misc-unsafe-memory-access=allow',
				'-Djoml.nounsafe=true'
	}
}

repositories {
    flatDir { dirs 'libs' }
	mavenCentral()
	maven {
		name = "FirstDark"
		url = uri("https://maven.firstdark.dev/releases")
	}
	maven {
		name = "Jitpack"
		url = uri("https://jitpack.io")
	}
	maven {
		name = "Modrinth"
		url = uri("https://api.modrinth.com/maven")
		content { includeGroup "maven.modrinth" }
	}
}

configurations {
	bundled {
		canBeConsumed = false
		canBeResolved = true
	}
	implementation.extendsFrom bundled
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	compileOnly "org.projectlombok:lombok:${project.lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"

	bundled "com.github.donyka:discord-rpc:${project.drpc_version}"

	// Performance mods shipped inside our jar (Jar-in-Jar). Fabric Loader keeps a single copy of
	// each mod id and prefers whatever satisfies every dependency, newest first — so when a player
	// already has their own Sodium (or Lithium, ...) in the mods folder, the bundled one simply
	// stands down, and Iris' version constraints on Sodium are still honoured.
	// Licences allow redistribution with the licence kept (each jar carries its own): Sodium
	// (PolyForm Shield), Lithium and ImmediatelyFast (LGPL), FerriteCore and Dynamic FPS (MIT).
	// EntityCulling and MoreCulling are deliberately not bundled: their licences forbid it or
	// would pull the whole mod under the GPL.
	["sodium:${project.sodium_version}",
	 "lithium:${project.lithium_version}",
	 "ferrite-core:${project.ferritecore_version}",
	 "immediatelyfast:${project.immediatelyfast_version}",
	 "dynamic-fps:${project.dynamicfps_version}"].each { coordinate ->
		include "maven.modrinth:${coordinate}"
		runtimeOnly "maven.modrinth:${coordinate}"
	}

	implementation "org.json:json:${project.json_version}"
    implementation name: 'shine'
    include name: 'shine'
    implementation name: 'atmospherics'
    include name: 'atmospherics'
}

// Client game tests (./gradlew runClientGameTest) live in their own source set and never ship:
// they create a world, set up a scene and take screenshots of the visuals for inspection.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "festvisuals-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
		clearRunDirectory = false
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

tasks.named('test', Test) {
	failOnNoDiscoveredTests = false
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from {
		configurations.bundled.collect { it.isDirectory() ? it : zipTree(it) }
	}
	duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}

// Obfuscate the remapped jar in place: rename and repackage our classes, strip debug info. Runs as
// part of `build`, so CI ships the obfuscated jar. Mixins, entry points and annotations are kept
// (see proguard-rules.pro); bundled third-party code is left untouched. The jar path is derived
// from the naming convention; this Loom produces the shipped jar as the `jar` task output.
def releaseJar = layout.buildDirectory.file("libs/${project.archives_base_name}-${project.version}.jar").get().asFile
def obfJar = new File(releaseJar.parentFile, releaseJar.name.replaceFirst(/\.jar$/, '-obf.jar'))

tasks.register('obfuscateJar', ProGuardTask) {
	dependsOn 'jar'

	injars releaseJar
	outjars obfJar

	// Compile classpath carries the intermediary Minecraft jar plus Fabric and dependencies.
	libraryjars sourceSets.main.compileClasspath
	// The JDK, as modules (only what the mod touches; -dontwarn covers anything missed).
	["java.base", "java.desktop", "java.logging", "java.management", "java.naming",
	 "java.net.http", "jdk.unsupported"].each { mod ->
		libraryjars "${System.getProperty('java.home')}/jmods/${mod}.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
	}

	configuration file('proguard-rules.pro')

	doLast {
		if (!obfJar.exists()) throw new GradleException("ProGuard produced no jar")
		releaseJar.delete()
		obfJar.renameTo(releaseJar)
		logger.lifecycle("Obfuscated ${releaseJar.name}")
	}
}

tasks.named('build') { dependsOn 'obfuscateJar' }






